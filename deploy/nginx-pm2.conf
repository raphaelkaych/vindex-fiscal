# Substitua o domínio e os caminhos de certificado antes de nginx -t.
# Restrinja 8000/Redis ao loopback. Somente este proxy define o protocolo.
server {
    listen 80;
    server_name fiscal.seu-dominio.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name fiscal.seu-dominio.com;
    ssl_certificate /etc/letsencrypt/live/fiscal.seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fiscal.seu-dominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    access_log off;
    location /static/ { alias /var/lib/vindex/static/; expires 1h; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 130s;
    }
}
