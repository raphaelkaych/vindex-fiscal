openapi: 3.0.3
info:
  title: Vindex Fiscal API
  version: 1.0.0
  description: API independente, limitada ao cliente e aos CNPJs da credencial. Valores
    são previsões; não confirma pagamento bancário.
paths:
  /api/v1/boletos/:
    get:
      operationId: boletos_list
      description: Boletos locais. Dígitos verificados não comprovam autenticidade
        ou liquidação bancária.
      parameters:
      - in: query
        name: cnpj
        schema:
          type: string
        description: CNPJ completo de uma empresa autorizada.
      - in: query
        name: company
        schema:
          type: integer
        description: ID de uma empresa autorizada.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: Início inclusivo (emissão/vencimento conforme recurso).
      - in: query
        name: invoice
        schema:
          type: integer
      - in: query
        name: linked
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
      - in: query
        name: ordering
        schema:
          type: string
        description: Campos permitidos; prefixo - inverte. Consulte API.md.
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: review
        schema:
          type: string
          enum:
          - clear
          - pending
        description: Pendência de revisão.
      - in: query
        name: source
        schema:
          type: string
        description: Origem exata, conforme recurso.
      - in: query
        name: supplier
        schema:
          type: string
        description: Nome parcial ou CNPJ do fornecedor/beneficiário.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Fim inclusivo.
      - in: query
        name: validation_state
        schema:
          type: string
          enum:
          - pending
          - validated
      tags:
      - boletos
      security:
      - VindexIntegration: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoletoList'
          description: ''
        '400':
          description: Erro padronizado. Consulte código, mensagem e detalhes.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    - details
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
        '401':
          description: Erro padronizado. Consulte código, mensagem e detalhes.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
