components:
  schemas:
    Boleto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          type: integer
          readOnly: true
        installment:
          type: integer
          readOnly: true
          nullable: true
        invoice:
          type: integer
          readOnly: true
          nullable: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        barcode:
          type: string
          readOnly: true
          nullable: true
          title: Código de barras
        digitable_line:
          type: string
          readOnly: true
          title: Linha digitável
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
          title: Valor declarado
        due_on:
          type: string
          format: date
          readOnly: true
          nullable: true
          title: Vencimento declarado
        due_candidates:
          readOnly: true
        beneficiary_name:
          type: string
          readOnly: true
          title: Beneficiário
        beneficiary_document:
          type: string
          readOnly: true
          title: CPF/CNPJ do beneficiário
        payer_name:
          type: string
          readOnly: true
          title: Pagador
        payer_document:
          type: string
          readOnly: true
          title: CPF/CNPJ do pagador
        bank_code:
          type: string
          readOnly: true
          title: Código do banco
        reference:
          type: string
          readOnly: true
          title: Identificação do documento
        source:
          allOf:
          - $ref: '#/components/schemas/BoletoSourceEnum'
          readOnly: true
          title: Origem
        validation_state:
          allOf:
          - $ref: '#/components/schemas/ValidationStateEnum'
          readOnly: true
        review_notes:
          type: string
          readOnly: true
        needs_review:
          type: boolean
          readOnly: true
        has_pdf:
          type: boolean
          readOnly: true
        financial_status:
          type: string
          readOnly: true
        imported_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - bank_code
      - barcode
      - beneficiary_document
      - beneficiary_name
      - company
      - digitable_line
      - due_candidates
      - due_on
      - financial_status
      - has_pdf
      - id
      - imported_at
      - installment
      - invoice
      - kind
      - needs_review
      - payer_document
      - payer_name
      - reference
      - review_notes
      - source
      - updated_at
      - validation_state
    BoletoAssociateRequest:
