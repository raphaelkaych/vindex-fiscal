<div class="fiscal-field{% if field.errors %} has-error{% endif %}{% if field_class %} {{ field_class }}{% endif %}">
<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
{% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
{% if field.errors %}<div class="filter-field-errors" id="{{ field.auto_id }}_error">{% for error in field.errors %}<span>{{ error }}</span>{% endfor %}</div>{% endif %}
</div>
