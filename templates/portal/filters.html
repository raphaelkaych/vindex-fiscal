<div class="filter-field filter-search"><label for="search">Buscar</label><div class="input-icon">{% load portal_tags %}{% icon 'search' %}<input id="search" name="q" value="{{ request.GET.q }}" maxlength="150" placeholder="Fornecedor, número ou chave"></div></div><div class="filter-field"><label for="filter-company">Empresa</label><select name="company" id="filter-company"><option value="">Todas as empresas</option>{% for company in companies %}<option value="{{ company.pk }}" {% if selected_company.pk == company.pk %}selected{% endif %}>{{ company.display_name }}</option>{% endfor %}</select></div><div class="filter-field date-field"><label for="from">De</label><input type="date" name="from" id="from" value="{{ request.GET.from }}"></div><div class="filter-field date-field"><label for="to">Até</label><input type="date" name="to" id="to" value="{{ request.GET.to }}"></div>
